<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>Melia's iPhone — Closet to the Bone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <header class="project-heading">
      <p class="eyebrow">CLOSET TO THE BONE · INTERACTIVE FICTION</p>
      <h1>Melia's iPhone</h1>
      <p class="subheading">A private device. A few things that don't add up.</p>
    </header>
    <section class="phone" aria-label="Interactive iPhone simulation">
      <div class="side-button"></div><div class="dynamic-island"></div>
      <div class="screen">
        <div class="statusbar"><span id="clock">9:41</span><div class="status-icons"><span>▮▮▮</span><span>◉</span><span class="battery">▰</span></div></div>
        <div id="app" class="app-view"></div>
        <div class="home-indicator" id="home-indicator" title="Return to Home"></div>
      </div>
    </section>
    <aside class="reader-tools">
      <div><span class="tool-label">INVESTIGATION NOTES</span><strong id="clue-count">0 / 5 clues found</strong></div>
      <button id="notes-button" class="tool-button">Notebook</button>
      <button id="reset-button" class="reset-button">Reset</button>
    </aside>
    <p class="disclaimer">Fictional interface. No real location, messages or device data are accessed.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
